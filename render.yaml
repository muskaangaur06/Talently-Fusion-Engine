services:
  - type: web
    name: ai-job-board-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_PATH
        value: ./data/jobs.db
      - key: FAISS_INDEX_PATH
        value: ./data/jobs.faiss
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CORS_ORIGINS
        value: https://talentlyfusion.vercel.app
      - key: OMP_NUM_THREADS
        value: "1"
