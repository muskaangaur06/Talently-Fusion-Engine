<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#0d1117"/>
  <text x="360" y="34" fill="#e6edf3" font-size="18" font-weight="700" text-anchor="middle">Retrieval Quality by Probe Query</text>
  <text x="360" y="54" fill="#8b949e" font-size="12" text-anchor="middle">NDCG@10, six held-out queries across job categories</text>

  <!-- gridlines -->
  <line x1="70" y1="90" x2="70" y2="290" stroke="#30363d" stroke-width="1"/>
  <line x1="70" y1="290" x2="690" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="94" fill="#8b949e" font-size="10" text-anchor="end">1.0</text>
  <text x="60" y="194" fill="#8b949e" font-size="10" text-anchor="end">0.5</text>
  <text x="60" y="294" fill="#8b949e" font-size="10" text-anchor="end">0.0</text>
  <line x1="70" y1="190" x2="690" y2="190" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- bars: baseline y=290, top y=90, scale = 200px per 1.0 -->
  <!-- python data scientist: 1.000 -->
  <rect x="95" y="90" width="70" height="200" rx="4" fill="#2ea043"/>
  <text x="130" y="82" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">1.000</text>
  <text x="130" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">python data</text>
  <text x="130" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">scientist</text>

  <!-- react frontend developer: 1.000 -->
  <rect x="195" y="90" width="70" height="200" rx="4" fill="#2ea043"/>
  <text x="230" y="82" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">1.000</text>
  <text x="230" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">react frontend</text>
  <text x="230" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">developer</text>

  <!-- java backend engineer: 1.000 -->
  <rect x="295" y="90" width="70" height="200" rx="4" fill="#2ea043"/>
  <text x="330" y="82" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">1.000</text>
  <text x="330" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">java backend</text>
  <text x="330" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">engineer</text>

  <!-- sql data analyst: 0.984 -->
  <rect x="395" y="93.2" width="70" height="196.8" rx="4" fill="#3fb950"/>
  <text x="430" y="85.2" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">0.984</text>
  <text x="430" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">sql data</text>
  <text x="430" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">analyst</text>

  <!-- devops kubernetes aws: 0.981 -->
  <rect x="495" y="93.8" width="70" height="196.2" rx="4" fill="#3fb950"/>
  <text x="530" y="85.8" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">0.981</text>
  <text x="530" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">devops</text>
  <text x="530" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">kubernetes aws</text>

  <!-- product manager remote: 0.859 -->
  <rect x="595" y="118.2" width="70" height="171.8" rx="4" fill="#d29922"/>
  <text x="630" y="110.2" fill="#e6edf3" font-size="12" font-weight="700" text-anchor="middle">0.859</text>
  <text x="630" y="308" fill="#c9d1d9" font-size="10" text-anchor="middle">product manager</text>
  <text x="630" y="320" fill="#c9d1d9" font-size="10" text-anchor="middle">remote</text>

  <text x="360" y="346" fill="#8b949e" font-size="11" text-anchor="middle">Average NDCG@10: 0.971  |  MRR: 1.000 across all probes</text>
</svg>
